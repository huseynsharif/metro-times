name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/baku-metro-timer-yYVmG
  workflow_dispatch:

# Pages deploy üçün lazımi icazələr
permissions:
  contents: read
  pages: write
  id-token: write

# Eyni anda yalnız bir deploy
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: Pages söndürülübsə avtomatik aktivləşdirir
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # statik fayllar repo kökündədir
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
